<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPMD - Website Moved</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b98d5, #004d73);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            background: #ffffff;
            max-width: 700px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        .top-banner {
            background: linear-gradient(135deg, #0b98d5, #006a9c);
            padding: 30px 20px;
            color: white;
        }

        .top-banner h1 {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .top-banner p {
            font-size: 16px;
            opacity: 0.95;
        }

        .content {
            padding: 45px 35px;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .message {
            font-size: 22px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .website-link {
            color: #0b98d5;
            font-weight: 600;
            text-decoration: none;
            word-break: break-word;
        }

        .website-link:hover {
            text-decoration: underline;
        }

        .visit-btn {
            display: inline-block;
            background: #0b98d5;
            color: white;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.3s ease;
            box-shadow: 0 10px 20px rgba(11, 152, 213, 0.3);
        }

        .visit-btn:hover {
            background: #0879a8;
            transform: translateY(-2px);
        }

        .footer {
            padding: 18px;
            background: #f5f7fa;
            color: #666;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .top-banner h1 {
                font-size: 26px;
            }

            .message {
                font-size: 18px;
            }

            .visit-btn {
                width: 100%;
                padding: 14px;
            }

            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="top-banner">
            
            
        </div>

        <div class="content">
            <div class="icon">🔄</div>

            <div class="message">
                This website has been moved and is now accessible at:<br>
                <a href="https://paimana-proj.mospi.gov.in/" target="_blank" class="website-link">
                    https://paimana-proj.mospi.gov.in/
                </a>
            </div>

            <a href="https://paimana-proj.mospi.gov.in/" target="_blank" class="visit-btn">
                Visit New Website
            </a>
        </div>

        <div class="footer">
            Ministry of Statistics and Programme Implementation
        </div>
    </div>

</body>
</html>
